name: GenAI Production CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r src/backend/requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Execute Pytest Suite
        run: |
          pytest tests/ -v

  security-scan:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build local container for scanning
        run: |
          docker build -t genai-backend:scan src/backend/

      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'genai-backend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  build-and-push-ecr:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/genai-backend:$IMAGE_TAG -t $ECR_REGISTRY/genai-backend:latest src/backend/
          docker push $ECR_REGISTRY/genai-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/genai-backend:latest

      - name: Build and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/genai-frontend:$IMAGE_TAG -t $ECR_REGISTRY/genai-frontend:latest src/frontend/
          docker push $ECR_REGISTRY/genai-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/genai-frontend:latest

  deploy-eks:
    name: Deploy to Amazon EKS via Helm
    runs-on: ubuntu-latest
    needs: build-and-push-ecr
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name genai-eks-cluster --region us-east-1

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Upgrade or Install GenAI Helm Chart
        run: |
          helm upgrade --install genai-app helm/genai-app \
            --namespace genai \
            --create-namespace \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout 10m

  post-deploy-smoke-test:
    name: Run Post-Deployment Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-eks
    steps:
      - name: Synthetic Health Check
        run: |
          curl -f --retry 5 --retry-delay 10 https://app.genai.example.com/api/v1/health || exit 1
